# the app's contract with Desktop: https://github.com/jeff-hykin/dimos-desktop-mirror/blob/main/docs/create-apps/index.md
title: Example (HTML)
version: "0.3.0"
spec-version: v1.5
uses:
    "@dimos-gateway":
        - GET /active
        - GET /msgs.js
        - GET /active/modules
        - POST /active/modules/{id}/rpcs/{name}
    "@desktop-gateway":
        # spec v1.5 adds `env:` here, the values an app needs of a provider's environment, keyed per value of
        # DIMOS_APP (every app gets DIMOS_APP, so naming the variable says nothing). A static app has no server and
        # so needs none of it: see the deno, rust and bun examples for a file that lists what it reads.
        - POST /ui/notifications
    "@zenoh-gateway": ">=0.5 <0.6"
    dim-controller:
        - GET api/status
# spec v1.2: what the page may do on zenoh, as zenoh's ACL config (the topic boxes take any topic of these types)
zenoh:
    default_permission: deny
    read:
        - id: odom-and-camera
          messages: [declare_subscriber, put] # subscribe, and receive its samples
          key_exprs: ["dimos/**/geometry_msgs.PoseStamped", "dimos/**/sensor_msgs.Image"]
          permission: allow
    write:
        - id: drive
          messages: [put] # the cmd_vel publisher (and its deadman)
          key_exprs: ["dimos/**/geometry_msgs.Twist"]
          permission: allow
