# dimos.yaml: what this app is, what it needs from Desktop/dimos/other apps, and what it offers.
# The spec only ever grows (new optional keys); a Desktop ignores keys it doesn't know. See GUIDE.md.
title: Example (HTML)
# REQUIRED: the dimos.yaml spec version this file follows (v1.x only grows; a breaking change would be v2)
spec-version: v1.0
# every endpoint this app calls OUTSIDE itself (Desktop refuses an undeclared call from its pages)
dimos-api:
    - GET /dimos/runs # the dimos gateway: what's running
    - GET /apps/dim-controller/api/status # another app's public (agent:) endpoint
    - POST /api/notifications # Desktop: a notification
# it subscribes/publishes topics through Desktop's zenoh-web bridge: the bridge versions it works with
zenoh-web: ">=0.4 <0.5"
# no agent: / private: here: a static app has no server to answer them (see the Deno and Rust examples)
